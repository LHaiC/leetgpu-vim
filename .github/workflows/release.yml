name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify vendored monaco-vim
        run: node tools/vendor.mjs --check

      # --expect-tag fails the build when the tag and manifest.json version disagree.
      - name: Build distributable zip
        run: node tools/build.mjs --expect-tag "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
